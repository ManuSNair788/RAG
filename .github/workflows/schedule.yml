name: Daily RAG Data Ingestion

on:
  schedule:
    # Run everyday at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Allow manual triggers from the GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allows the action to commit back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Pipeline
        run: |
          python ingest.py

      - name: Commit and Push Updated Vector DB
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add chroma_db/
          
          # Only commit if there are changes to the DB
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated RAG Vector Database Update"
            git push
          fi
